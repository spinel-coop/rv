name: GitHub Actions security

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    runs-on: namespace-profile-rv-linux-x86
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Check out repo (namespace)
        if: startsWith(matrix.runs-on, 'namespace-profile-')
        uses: namespacelabs/nscloud-checkout-action@c79409f8642d7fca9c1169a97f84d7ada5de1f9e # v9.0.2
        with:
          persist-credentials: false
      - name: Check out repo
        if: ${{ ! startsWith(matrix.runs-on, 'namespace-profile-') }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
